[project]
name = "st"
version = "0.3.0"
description = "Sonatype IQ Server CLI for agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Trust the OS certificate store (corporate TLS inspection CAs included).
    "truststore>=0.10",
]

[project.scripts]
st = "st.commands.root:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
